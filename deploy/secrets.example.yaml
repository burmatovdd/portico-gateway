apiVersion: v1
kind: Secret
metadata:
  name: portico-gateway
  namespace: portico
# Save the filled copy outside version control.
type: Opaque
stringData:
  database-password: REPLACE_ME

  # Generate once with: openssl rand -base64 32
  # Paste the single-line output below in place of the placeholder.
  # Use the same key for all Portico replicas and keep it across upgrades.
  # Back up this key securely with the database; existing sessions require it.
  encryption-key: REPLACE_WITH_BASE64_32_RANDOM_BYTES
  oidc-client-secret: ''

  # Generate with: openssl rand -hex 32
  # Enter the same value in the Open WebUI MCP connection settings.
  openwebui-client-secret: REPLACE_WITH_RANDOM_CLIENT_SECRET

  # Dedicated LiteLLM virtual key restricted to the models in models.config.rules.
  litellm-api-key: REPLACE_WITH_RESTRICTED_LITELLM_KEY
