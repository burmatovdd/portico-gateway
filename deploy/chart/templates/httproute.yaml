{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs: {{ toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.gateway.hostname | quote }}]
  rules:
    {{- if .Values.models.enabled }}
    - matches: [{path: {type: PathPrefix, value: /v1}}]
      timeouts: {request: 620s, backendRequest: 610s}
      backendRefs: [{name: {{ .Release.Name }}-models, port: 8080}]
    {{- end }}
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: {{ .Release.Name }}-core, port: 8080}]
{{- end }}
