{{- if .Values.models.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-models
data:
  config.yaml: |
    {{- toYaml .Values.models.config | nindent 4 }}
  database-ca.crt: |
    {{- range .Values.database.certificates }}
    {{- . | nindent 4 }}
    {{- end }}
  ca.crt: |
    {{- range .Values.certificates }}
    {{- . | nindent 4 }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-models
spec:
  replicas: {{ .Values.models.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: models}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: models}
      annotations:
        checksum/config: {{ toJson .Values.models.config | sha256sum }}
        checksum/database-ca: {{ toJson .Values.database.certificates | sha256sum }}
        checksum/ca: {{ toJson .Values.certificates | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      containers:
        - name: models
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/portico-models]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          resources: {{ toYaml .Values.models.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
          env:
            - {name: PORTICO_MODELS_CONFIG, value: /etc/portico-models/config.yaml}
            {{- if .Values.certificates }}
            - {name: PORTICO_CA_FILE, value: /etc/portico-models/ca.crt}
            {{- end }}
            {{- if eq .Values.models.config.policy_store "postgres" }}
            - {name: PORTICO_DATABASE_HOST, value: {{ .Values.database.host | quote }}}
            - {name: PORTICO_DATABASE_PORT, value: {{ .Values.database.port | quote }}}
            - {name: PORTICO_DATABASE_NAME, value: {{ .Values.database.databaseName | quote }}}
            - {name: PORTICO_DATABASE_USER, value: {{ .Values.database.user | quote }}}
            - {name: PORTICO_DATABASE_SSLMODE, value: {{ .Values.database.sslMode | quote }}}
            {{- if .Values.database.certificates }}
            - {name: PORTICO_DATABASE_CA_FILE, value: /etc/portico-models/database-ca.crt}
            {{- end }}
            - name: PORTICO_DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-password}}
            {{- end }}
            - name: PORTICO_LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: {{ .Values.models.secretKey }}}}
          volumeMounts: [{name: config, mountPath: /etc/portico-models, readOnly: true}]
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-models}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-models
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: models}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-models
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: models}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{ concat .Values.networkPolicy.ingressFrom .Values.models.networkPolicy.ingressFrom | toYaml | nindent 8 }}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    {{- toYaml .Values.models.networkPolicy.egressRules | nindent 4 }}
    {{- if eq .Values.models.config.policy_store "postgres" }}
    {{- range .Values.networkPolicy.egressRules }}
    {{- $rule := . }}
    {{- range .ports }}
    {{- if eq (int .port) (int $.Values.database.port) }}
    - {{ toYaml $rule | nindent 6 | trim }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
